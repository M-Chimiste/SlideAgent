[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slideforge-backend"
version = "0.1.0"
description = "SlideForge backend service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "aiosqlite>=0.19",
  "boto3>=1.34",
  "python-pptx>=0.6.23",
  "lxml>=5.1",
  "markitdown[pptx]>=0.1.3",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "Pillow>=10.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
slideforge-qwen-smoke = "app.tools.all_mode_smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
